    en: 'The Ch. 02 delimitation “formal rights → legal side” refers to the GDPR cross-check, which in turn refers to DPO/GRC (“Legal basis, purposes, rights | Legal matter”): the technical capability supporting the rights is left without a prescriptive owner outside PRI-003.'
