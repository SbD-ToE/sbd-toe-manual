          referencia: "Reg. (UE) 2024/1689, art. 12.º, n.os 1 e 2"
          citacao: {pt: "Os sistemas de IA de risco elevado devem permitir tecnicamente o registo automático de eventos («registos») durante a vida útil do sistema.", en: "High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system."}
