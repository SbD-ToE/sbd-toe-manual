    ancora: acc
    citacao:
      pt: Contas sem permissões desnecessárias
      en: Accounts without unnecessary permissions
  falta:
    pt: Minimização de exposição e de privilégios por princípio; faltam configurações de privacidade por defeito voltadas ao utilizador (opt-in, visibilidade restrita) e a regra de não disponibilizar dados, sem intervenção humana, a um número indeterminado de pessoas; os requisitos PRI-* só se aplicam a L2/L3, mas uma aplicação interna com dados pessoais e impacto baixo soma E1+D2+I1 = 4 → L1, e fica sem requisito de privacidade (o RGPD aplica-se independentemente do nível).
    en: Minimisation of exposure and privileges by principle; user-facing privacy-by-default settings (opt-in, restricted visibility) and the rule of not making data accessible, without human intervention, to an indefinite number of persons are missing; the PRI-* requirements apply only to L2/L3, but an internal application with personal data and low impact scores E1+D2+I1 = 4 → L1, and is left without any privacy requirement (the GDPR applies regardless of the level).
