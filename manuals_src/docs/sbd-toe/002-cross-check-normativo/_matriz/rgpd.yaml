- id: RGPD-5-1-e
  acto_fonte: 32016R0679
  referencia: Art. 5.º, n.º 1, alínea e)
  classe: engenharia
  forca: parcial
  contexto: null
  resposta:
  - tipo: requisito
    alvo: PRI-002
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: pri
    citacao:
      pt: Conjuntos de dados pessoais têm prazo de retenção definido; o apagamento no fim do prazo é executado e verificável
      en: Personal-data sets have a defined retention period; deletion at the end of the period is carried out and verifiable
  - tipo: politica
    rotulo:
      pt: Política 29 §7
      en: Policy 29 §7
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 7-retenção-de-logs
    citacao:
      pt: quando os registos contêm dados pessoais, a conservação não excede o necessário para a finalidade (RGPD, art. 5.º, n.º 1, al. e))
      en: where logs contain personal data, they are kept for no longer than is necessary for the purpose (GDPR, Article 5(1), point (e))
  - tipo: politica
    rotulo:
      pt: Política 29 §7
      en: Policy 29 §7
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 7-retenção-de-logs
    citacao:
      pt: A organização mantém um mapa que indica, por tipo de registo, o regime que fixa o prazo
      en: The organisation maintains a map that shows, for each record type, the regime that sets the period
  - tipo: politica
    rotulo:
      pt: Política 06 §10
      en: Policy 06 §10
    ficheiro: 020-assets/policies/06_policy-rastreabilidade.md
    ancora: 10-prazos-de-retenção-mínimos
    citacao:
      pt: sempre com o limite do RGPD quando há dados pessoais
      en: always within the GDPR limit where personal data are involved
  falta:
    pt: Prazo máximo e apagamento verificável só em L2/L3 (PRI-002); os requisitos PRI-* só se aplicam a L2/L3, mas uma aplicação interna com dados pessoais e impacto baixo soma E1+D2+I1 = 4 → L1, e fica sem requisito de privacidade (o RGPD aplica-se independentemente do nível). Não se estende explicitamente a backups, réplicas e sistemas a jusante, nem prevê anonimização como alternativa ao apagamento.
    en: Maximum period and verifiable erasure only at L2/L3 (PRI-002); the PRI-* requirements apply only to L2/L3, but an internal application with personal data and low impact scores E1+D2+I1 = 4 → L1, and is left without any privacy requirement (the GDPR applies regardless of the level). It does not explicitly extend to backups, replicas and downstream systems, nor does it provide for anonymisation as an alternative to erasure.
  razao_fora_de_ambito: null
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 25.5.2018 (art. 99.º, n.º 2)
  substitui: [EXT-RGPD-OBL-5]
  nota:
    pt: 'Sem contradição: as tabelas de retenção de logs/evidências são mínimos, e a cláusula de precedência da Política 29 §7 limita-os expressamente pelo art. 5.º, n.º 1, al. e). Tensão residual: o WORM obrigatório em L3 (Política 29 §8) impede apagar antes do prazo fixado — ver RGPD-17-1.'
    en: 'No contradiction: the log/evidence retention tables are minimums, and the precedence clause of Policy 29 §7 expressly limits them by Article 5(1), point (e). Residual tension: the WORM mandatory at L3 (Policy 29 §8) prevents erasure before the fixed period — see RGPD-17-1.'
