    ancora: pri
    citacao:
      pt: Existe mecanismo testado para apagar e para exportar os dados pessoais de um titular identificado, sem intervenção manual em base de dados
      en: A tested mechanism exists to delete and to export the personal data of an identified data subject, without manual intervention in the database
  falta:
    pt: O mecanismo de exportação não fixa formato eletrónico de uso corrente nem salvaguarda de direitos de terceiros (n.º 4); os requisitos PRI-* só se aplicam a L2/L3, mas uma aplicação interna com dados pessoais e impacto baixo soma E1+D2+I1 = 4 → L1, e fica sem requisito de privacidade (o RGPD aplica-se independentemente do nível).
    en: The export mechanism does not fix a commonly used electronic format nor a safeguard for the rights of third parties (paragraph 4); the PRI-* requirements apply only to L2/L3, but an internal application with personal data and low impact scores E1+D2+I1 = 4 → L1, and is left without any privacy requirement (the GDPR applies regardless of the level).
