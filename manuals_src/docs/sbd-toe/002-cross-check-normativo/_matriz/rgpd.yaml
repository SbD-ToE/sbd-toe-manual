  explicacao_conflito:
    pt: 'Contradição interna com efeito legal: a Política 33 §10.7 marca a «Conformidade regulatória declarada» (que inclui o contrato do art. 28.º) como «—» em L1 e «Aplicável quando relevante» em L2, ao passo que o art. 28.º, n.º 3, é exigível sempre que um subcontratante trata dados pessoais — e a Política 18 §10.7 marca-o «Obrigatório (sempre que há PII)» em todos os níveis.'
    en: 'Internal contradiction with legal effect: Policy 33 §10.7 marks “Declared regulatory compliance” (which includes the Article 28 contract) as “—” at L1 and “Applicable when relevant” at L2, whereas Article 28(3) is enforceable whenever a processor processes personal data — and Policy 18 §10.7 marks it “Mandatory (whenever there is PII)” at all levels.'
