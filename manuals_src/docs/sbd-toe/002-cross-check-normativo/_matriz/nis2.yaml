- id: NIS2-28-1
  acto_fonte: 32022L2555
  referencia:
    pt: Art. 28.º, n.º 1
    en: Article 28(1)
  classe: engenharia
  forca: fora_de_ambito
  contexto: null
  resposta: []
  falta: null
  razao_fora_de_ambito:
    pt: Dever funcional específico dos registos de TLD e das entidades que prestam serviços de registo de nomes de domínio (conteúdo e acesso à base de dados de registo); é requisito de negócio do serviço, não prática de engenharia de segurança que um manual SbD genérico deva prescrever.
    en: Specific functional duty of TLD name registries and entities providing domain name registration services (content of and access to the registration database); it is a business requirement of the service, not a security engineering practice that a generic SbD manual should prescribe.
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 18.10.2024 (art. 41.º — aplicação das medidas nacionais de transposição)
  substitui: []
  nota:
    pt: 'Dever da Diretiva (UE) 2022/2555: aplica-se às entidades essenciais e importantes através da transposição nacional (em Portugal, o regime jurídico da cibersegurança que a transpõe); o texto nacional pode concretizar ou acrescentar. A exatidão e o acesso a dados pessoais de registo cruzam-se com o RGPD (PRI-*), mas o dever é específico do serviço de registo.'
    en: 'Duty under Directive (EU) 2022/2555: applies to essential entities and important entities through national transposition (in Portugal, the national cybersecurity legal framework that transposes it); the national text may specify or add to it. The accuracy of and access to personal registration data intersect with the GDPR (PRI-*), but the duty is specific to the registration service.'
