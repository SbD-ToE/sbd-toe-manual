    en: 'Implementing Regulation (EU) 2024/2690: directly applicable since 7.11.2024, but only to the relevant entities of Article 1 (DNS, TLD registries, cloud, data centres, CDN, managed services and managed security services, online marketplaces, search engines, social networks, trust services); for the other NIS2 entities it serves as a good-practice reference. It is the mechanism that makes most of the conflicts in this map structural.'
