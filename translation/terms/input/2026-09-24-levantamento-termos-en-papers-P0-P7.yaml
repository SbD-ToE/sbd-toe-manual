  metodo:
    contagem: regex case-insensitive com fronteiras de palavra sobre o texto integral de cada ficheiro (inclui referências);
      variantes = formas exactas encontradas; total = soma P0–P7 sem P4-drift.
    citacoes: 'verbatim, localizadas por paper + nº de linha do ficheiro-fonte + cabeçalho de secção; verificadas
      por substring após normalização (aspas, itálico). `verified: ok` = texto encontrado; `partial` = só os primeiros
      40 caracteres.'
    origem: emprestado (uso padrão da área) | emprestado-especializado (palavra corrente com sentido técnico do
      programa) | coinagem (termo criado pelo programa) | nao-traduzir (ids, siglas, normas, nomes próprios).
    pt_status: inequivoco (conceito PT estabelecido no Manual/ontologia com o mesmo sentido) | nao-inequivoco (não
      decidido — não decidir aqui) | sem-equivalente (nenhum PT no registo) | colisao (palavra PT existe com OUTRO
      sentido).
    custo_de_mudanca: alto = em título de paper com DOI ou em slug do repo; medio = ≥40 ocorrências; baixo = restante.
  fronteiras: Nada publicado foi alterado. Nenhum termo foi decidido. Termos com dois sentidos dentro dos papers
    estão marcados em `achados` e em `multiplos_sentidos`.
