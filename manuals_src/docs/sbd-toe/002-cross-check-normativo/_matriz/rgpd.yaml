  forca: fora_de_ambito
  contexto: null
  resposta:
  - tipo: pagina
    rotulo:
      pt: As sete categorias de ameaça
      en: The seven threat categories
    ficheiro: 010-sbd-manual/03-threat-modeling/addon/13-linddun-privacidade.md
    ancora: as-sete-categorias-de-ameaça
    citacao:
      pt: A pessoa não está informada sobre a recolha, o processamento ou a partilha dos seus dados
      en: The person is not informed about the collection, processing or sharing of their data
  falta: null
  razao_fora_de_ambito:
    pt: 'Dever jurídico (conteúdo/validade do tratamento ou relação jurídica) — o Manual delimita-o explicitamente para fora: «O lado legal — bases legais, direitos formais, obrigações regulatórias — não vive neste catálogo» (cap. 02, PRI); o cross-check RGPD remete-o para Jurídico/DPO.'
    en: 'Legal duty (content/validity of the processing or legal relationship) — the Manual explicitly delimits it out of scope: “The legal side — legal bases, formal rights, regulatory obligations — does not live in this catalogue” (Ch. 02, PRI); the GDPR cross-check refers it to Legal/DPO.'
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 25.5.2018 (art. 99.º, n.º 2)
  substitui: [EXT-RGPD-OBL-5]
  nota:
    pt: A licitude e a lealdade são juízo jurídico; a transparência tem apoio técnico apenas na elicitação da ameaça «Unawareness» do LINDDUN (L3/dados pessoais).
    en: Lawfulness and fairness are a legal judgement; transparency has technical support only in the elicitation of the LINDDUN “Unawareness” threat (L3/personal data).
