  - id: CTX-RGPD
    nome: {pt: Tratamento de dados pessoais (RGPD), en: Processing of personal data (GDPR)}
    acto_fonte: [32016R0679]
    matriz: _matriz/rgpd.yaml
    declara_se_em: aplicacao
    sempre_declarado: true   # declara-se sempre (sim ou não); nunca se deduz de data_sensitivity
    graus_admitidos: []
    criterio:
      obrigacoes: []
      referencia: "Reg. (UE) 2016/679, art. 2.º, n.º 1"
      citacao:
        pt: "O presente regulamento aplica-se ao tratamento de dados pessoais por meios total ou parcialmente automatizados"
        en: "This Regulation applies to the processing of personal data wholly or partly by automated means"
      texto:
        pt: A aplicação trata dados pessoais. A declaração é sempre explícita (sim ou não) e nunca se deduz da classificação de sensibilidade dos dados.
        en: The application processes personal data. The declaration is always explicit (yes or no) and is never inferred from the data sensitivity classification.
    pisos:
      - id: CTX-RGPD-P01
        alvo: {tipo: politica, ficheiro: 020-assets/policies/33_policy-contratacao-segura.md, ancora: 107-operacionalização, rotulo: {pt: Política 33 §10.7, en: Policy 33 §10.7}}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: {pt: "Contrato do art. 28.º, n.º 3, obrigatório em qualquer nível sempre que um subcontratante trata dados pessoais.", en: "Article 28(3) contract mandatory at any level whenever a processor processes personal data."}
        base:
          obrigacoes: [RGPD-28-3]
          referencia: "Reg. (UE) 2016/679, art. 28.º, n.º 3"
          citacao: {pt: "O tratamento em subcontratação é regulado por contrato", en: "Processing by a processor shall be governed by a contract"}
        admite_justificacao: true
      - id: CTX-RGPD-P02
        alvo: {tipo: politica, ficheiro: 020-assets/policies/18_policy-gestao-segredos.md, ancora: 103-sub-processadores, rotulo: {pt: Política 18 §10.3, en: Policy 18 §10.3}}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: {pt: "Contrato do art. 28.º, n.º 3, com os subcontratantes que recebem dados pessoais em prompts, em qualquer nível.", en: "Article 28(3) contract with the processors that receive personal data in prompts, at any level."}
        base:
          obrigacoes: [RGPD-28-3]
          referencia: "Reg. (UE) 2016/679, art. 28.º, n.º 3"
          citacao: {pt: "O tratamento em subcontratação é regulado por contrato", en: "Processing by a processor shall be governed by a contract"}
        admite_justificacao: true
      - id: CTX-RGPD-P03
        alvo: {tipo: requisito, alvo: OPS-016}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: {pt: "Dados pessoais incluídos nas cópias, com restauro testado.", en: "Personal data included in the backups, with tested restore."}
        base:
          obrigacoes: [RGPD-32-1-c]
          referencia: "Reg. (UE) 2016/679, art. 32.º, n.º 1, al. c)"
          citacao: {pt: "A capacidade de restabelecer a disponibilidade e o acesso aos dados pessoais de forma atempada no caso de um incidente físico ou técnico", en: "the ability to restore the availability and access to personal data in a timely manner in the event of a physical or technical incident"}
        admite_justificacao: false
      - id: CTX-RGPD-P04
        alvo: {tipo: requisito, alvo: PRI-004}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: {pt: "Inventário de finalidades e destinatários em qualquer nível: sem ele, as rectificações, os apagamentos e as limitações não chegam aos destinatários.", en: "Inventory of purposes and recipients at any level: without it, rectifications, erasures and restrictions do not reach the recipients."}
        base:
          obrigacoes: [RGPD-19]
          referencia: "Reg. (UE) 2016/679, art. 19.º"
          citacao: {pt: "a cada destinatário a quem os dados pessoais tenham sido transmitidos", en: "to each recipient to whom the personal data have been disclosed"}
        admite_justificacao: false
      - id: CTX-RGPD-P05
        alvo: {tipo: requisito, alvo: PRI-005}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: {pt: "Conceito de PII em registos em qualquer nível, com pseudónimos e chave por titular nos registos imutáveis (Política 29 §8.1).", en: "PII-in-logs concept at any level, with pseudonyms and a per-person key in immutable logs (Policy 29 §8.1)."}
        base:
          obrigacoes: [RGPD-32-1-a]
          referencia: "Reg. (UE) 2016/679, art. 32.º, n.º 1, al. a)"
          citacao: {pt: "A pseudonimização e a cifragem dos dados pessoais", en: "the pseudonymisation and encryption of personal data"}
        admite_justificacao: false

# CTX-<regime>-Rnn: requisitos que só fazem sentido sob o regime (destilação §6.7; lista aprovada pelo lead em 2026-09-27).
# Vivem só aqui, nunca nos catálogos; cada um declara a ligação a controlos.
acrescentos:
  - id: CTX-CRA-R01
    contexto: CTX-CRA
    grau: null
    niveis: null
    nome: {pt: "Período de apoio determinado, comunicado e cumprido", en: "Support period determined, communicated and honoured"}
    criterio_aceitacao:
      pt: "Período de apoio determinado por produto com os critérios do art. 13.º, n.º 8 (tempo de utilização previsto, expectativas razoáveis dos utilizadores, natureza e finalidade do produto) e com pelo menos cinco anos, salvo utilização prevista inferior; fundamentação registada na documentação técnica; data de fim do apoio indicada nas informações ao utilizador; utilizadores notificados do fim do apoio quando tecnicamente viável; cada actualização de segurança mantida disponível pelo menos 10 anos após a emissão ou pelo resto do período de apoio, se for mais longo; arquivos públicos de versões anteriores com aviso claro dos riscos de uso fora do período de apoio."
      en: "Support period determined per product with the criteria of Article 13(8) (expected use time, reasonable user expectations, nature and purpose of the product) and of at least five years, unless the expected use is shorter; rationale recorded in the technical documentation; end date of support stated in the information to the user; users notified of the end of support where technically feasible; each security update kept available for at least 10 years after issue or for the remainder of the support period, whichever is longer; public archives of earlier versions with a clear warning of the risks of use outside the support period."
    base:
      obrigacoes: [CRA-13-8-p2, CRA-13-8-p3, CRA-13-8-p5, CRA-13-9, CRA-13-11, CRA-13-19-p2, CRA-AnxII-7, CRA-AnxVII-4]
      referencia: "Reg. (UE) 2024/2847, art. 13.º, n.os 8, 9, 11 e 19; anexo II, ponto 7; anexo VII, ponto 4"
      citacao: {pt: "o período de apoio é de, pelo menos, cinco anos", en: "the support period shall be at least five years"}
    controlos: []
    sem_controlo_razao: {pt: "Dever de produto e de documentação, sem controlo técnico próprio no Manual.", en: "A product and documentation duty, with no dedicated technical control in the Manual."}
  - id: CTX-CRA-R02
    contexto: CTX-CRA
    grau: null
    niveis: null
    nome: {pt: "Distribuição e mecanismo de actualizações de segurança no utilizador", en: "Distribution and mechanism of security updates at the user"}
    criterio_aceitacao:
      pt: "Actualizações de segurança automáticas configuradas por defeito quando aplicável, com mecanismo de autoexclusão claro, notificação das actualizações disponíveis e opção de adiamento temporário; actualizações de segurança distribuídas sem demora e de forma gratuita (salvo acordo com um utilizador profissional sobre produto personalizado), separadas das actualizações de funcionalidades quando tecnicamente viável e acompanhadas de orientações sobre as medidas a tomar; distribuição segura e verificável (DST-003); instruções para instalar as actualizações e para desligar as automáticas nas informações ao utilizador."
      en: "Automatic security updates enabled by default where applicable, with a clear opt-out mechanism, notification of available updates and the option to postpone them temporarily; security updates disseminated without delay and free of charge (unless otherwise agreed with a business user for a tailor-made product), separate from functionality updates where technically feasible and accompanied by advisory messages on the action to be taken; secure and verifiable distribution (DST-003); instructions for installing updates and for turning off automatic updates in the information to the user."
    base:
      obrigacoes: [CRA-AnxI-P1-2c, CRA-AnxI-P2-2, CRA-AnxI-P2-7, CRA-AnxI-P2-8, CRA-AnxII-8c, CRA-AnxII-8e]
      referencia: "Reg. (UE) 2024/2847, anexo I, parte I, ponto 2, al. c), e parte II, pontos 2, 7 e 8; anexo II, ponto 8, als. c) e e)"
      citacao: {pt: "Assegurar que as atualizações de segurança disponíveis para resolver problemas de segurança identificados sejam distribuídas sem demora", en: "ensure that, where security updates are available to address identified security issues, they are disseminated without delay"}
    controlos: []
    sem_controlo_razao: {pt: "O controlo técnico da integridade da distribuição é DST-003, que o requisito referencia; o resto é dever de produto.", en: "The technical control for distribution integrity is DST-003, which the requirement references; the rest is a product duty."}
  - id: CTX-CRA-R03
    contexto: CTX-CRA
    grau: null
    niveis: null
    nome: {pt: "Avisos de segurança públicos sobre vulnerabilidades corrigidas", en: "Public security advisories on fixed vulnerabilities"}
    criterio_aceitacao:
      pt: "Depois de disponibilizada a actualização de segurança, aviso público sobre as vulnerabilidades corrigidas, com descrição, informação que permita identificar o produto afectado, impactos, gravidade e informação clara e acessível para a correcção; adiamento da divulgação só em casos devidamente justificados, registados, até os utilizadores terem tido a possibilidade de aplicar a correcção."
      en: "Once the security update is available, a public advisory on the fixed vulnerabilities, with a description, information allowing the affected product to be identified, impacts, severity and clear and accessible remediation information; delay of the disclosure only in duly justified, recorded cases, until users have had the possibility to apply the fix."
    base:
      obrigacoes: [CRA-AnxI-P2-4]
      referencia: "Reg. (UE) 2024/2847, anexo I, parte II, ponto 4"
      citacao: {pt: "Uma vez disponibilizada uma atualização de segurança, partilhar e divulgar publicamente informações sobre as vulnerabilidades corrigidas", en: "once a security update has been made available, share and publicly disclose information about fixed vulnerabilities"}
    controlos: []
    sem_controlo_razao: {pt: "Dever de comunicação pública; complementa GOV-015 (informação aos utilizadores afectados).", en: "A public communication duty; it complements GOV-015 (information to affected users)."}
  - id: CTX-CRA-R04
    contexto: CTX-CRA
    grau: null
    niveis: null
    nome: {pt: "Comunicação ao mantenedor de vulnerabilidades em componentes", en: "Reporting of component vulnerabilities to the maintainer"}
    criterio_aceitacao:
      pt: "Vulnerabilidade identificada num componente integrado no produto (incluindo de código aberto) comunicada à pessoa ou entidade que o fabrica ou mantém; correcção desenvolvida pela organização partilhada com o responsável pelo componente, se for caso disso em formato legível por máquina; vulnerabilidade tratada segundo a parte II do anexo I (DEP-007, DEP-010)."
      en: "A vulnerability identified in a component integrated in the product (including an open-source component) reported to the person or entity manufacturing or maintaining it; a fix developed by the organisation shared with the person responsible for the component, where appropriate in a machine-readable format; the vulnerability handled in accordance with Part II of Annex I (DEP-007, DEP-010)."
    base:
      obrigacoes: [CRA-13-6-a, CRA-13-6-b]
      referencia: "Reg. (UE) 2024/2847, art. 13.º, n.º 6"
      citacao: {pt: "os fabricantes devem comunicar a vulnerabilidade à pessoa ou entidade responsável pelo fabrico ou pela manutenção do componente", en: "report the vulnerability to the person or entity manufacturing or maintaining the component"}
    controlos: []
    sem_controlo_razao: {pt: "Dever de comunicação na cadeia de fornecimento, sem controlo técnico próprio.", en: "A supply-chain communication duty, with no dedicated technical control."}
  - id: CTX-DORA-R01
    contexto: CTX-DORA
    grau: null
    niveis: null
    nome: {pt: "Capacidades de TIC redundantes e teste de comutação", en: "Redundant ICT capacities and switchover testing"}
    criterio_aceitacao:
      pt: "Capacidades de TIC redundantes, com recursos, capacidade e funções adequados às necessidades do negócio, para os sistemas de que a aplicação depende (as microempresas avaliam a necessidade pelo perfil de risco); planos de resposta e recuperação testados pelo menos uma vez por ano, incluindo, nas entidades que não sejam microempresas, cenários de ciberataque e de comutação entre a infraestrutura primária e a capacidade redundante."
      en: "Redundant ICT capacities, with resources, capabilities and functions adequate to business needs, for the systems the application depends on (microenterprises assess the need based on their risk profile); response and recovery plans tested at least yearly, including, for entities other than microenterprises, cyber-attack scenarios and switchover between the primary ICT infrastructure and the redundant capacity."
    base:
      obrigacoes: [DORA-12-4, DORA-11-6-a]
      referencia: "Reg. (UE) 2022/2554, art. 12.º, n.º 4, e art. 11.º, n.º 6, al. a)"
      citacao: {pt: "mantêm capacidades de TIC redundantes equipadas com recursos, capacidade e funções suficientes", en: "shall maintain redundant ICT capacities equipped with resources, capabilities and functions that are adequate to ensure business needs"}
    controlos: []
    sem_controlo_razao: {pt: "Decisão de arquitectura e de capacidade, sem controlo técnico próprio no Manual; o teste apoia-se em OPS-016 e OPS-017.", en: "An architecture and capacity decision, with no dedicated technical control in the Manual; the test relies on OPS-016 and OPS-017."}
  - id: CTX-NIS2-R01
    contexto: CTX-NIS2
    grau: PERTINENTE
    niveis: null
    nome: {pt: "Redundância pelo menos parcial", en: "At least partial redundancy"}
    criterio_aceitacao:
      pt: "Com base na avaliação de riscos e no plano de continuidade, disponibilidade suficiente de recursos através de redundância, pelo menos parcial, dos sistemas de rede e informação e dos canais de comunicação de que a aplicação depende; recursos acompanhados e ajustados em função dos requisitos de cópias de segurança e de redundância."
      en: "Based on the risk assessment and the continuity plan, sufficient availability of resources through at least partial redundancy of the network and information systems and of the communication channels the application depends on; resources monitored and adjusted according to the backup and redundancy requirements."
    base:
      obrigacoes: [NIS2-IR2690-4.2.4, NIS2-IR2690-4.2.5]
      referencia: "Reg. de Execução (UE) 2024/2690, anexo, pontos 4.2.4 e 4.2.5"
      citacao: {pt: "asseguram a disponibilidade suficiente de recursos através, no mínimo, da redundância parcial dos seguintes elementos", en: "shall ensure sufficient availability of resources by at least partial redundancy of the following"}
    controlos: []
    sem_controlo_razao: {pt: "Decisão de arquitectura e de capacidade, sem controlo técnico próprio no Manual.", en: "An architecture and capacity decision, with no dedicated technical control in the Manual."}
  - id: CTX-RGPD-R01
    contexto: CTX-RGPD
    grau: null
    niveis: null
    nome: {pt: "Limitação do tratamento", en: "Restriction of processing"}
    criterio_aceitacao:
      pt: "Capacidade de marcar os dados pessoais de um titular como limitados; a marca é respeitada em todos os caminhos de tratamento (aplicação, integrações, exportações, análise), que passam a só conservar os dados, salvo consentimento do titular ou as excepções do art. 18.º, n.º 2; a marca propaga-se aos destinatários registados em PRI-004 e o levantamento da limitação fica registado."
      en: "Ability to flag a data subject's personal data as restricted; the flag is honoured on every processing path (application, integrations, exports, analytics), which then only store the data, save with the data subject's consent or under the exceptions of Article 18(2); the flag propagates to the recipients recorded in PRI-004, and lifting the restriction is logged."
    base:
      obrigacoes: [RGPD-18-1, RGPD-18-2]
      referencia: "Reg. (UE) 2016/679, art. 18.º, n.os 1 e 2"
      citacao: {pt: "os dados pessoais só podem, à exceção da conservação, ser objeto de tratamento com o consentimento do titular", en: "such personal data shall, with the exception of storage, only be processed with the data subject's consent"}
    controlos: []
    sem_controlo_razao: {pt: "Capacidade funcional da aplicação, verificada em teste com PRI-003; sem controlo técnico próprio no Manual.", en: "A functional capability of the application, verified in testing together with PRI-003; no dedicated technical control in the Manual."}
  - id: CTX-RGPD-R02
    contexto: CTX-RGPD
    grau: null
    niveis: null
    nome: {pt: "Apagamento de dados tornados públicos", en: "Erasure of data made public"}
    criterio_aceitacao:
      pt: "Quando a aplicação tornou públicos dados pessoais que depois tem de apagar: as medidas técnicas razoáveis para informar quem os trata (p. ex. pedido de remoção a motores de busca e a agregadores conhecidos, cabeçalhos e metadados de não indexação, invalidação de caches públicas) estão definidas e são executadas com o apagamento, com registo."
      en: "Where the application made personal data public and must later erase them: the reasonable technical steps to inform those processing them (e.g. removal requests to known search engines and aggregators, no-index headers and metadata, invalidation of public caches) are defined and carried out with the erasure, and logged."
    base:
      obrigacoes: [RGPD-17-2]
      referencia: "Reg. (UE) 2016/679, art. 17.º, n.º 2"
      citacao: {pt: "toma as medidas que forem razoáveis, incluindo de caráter técnico", en: "shall take reasonable steps, including technical measures"}
    controlos: []
    sem_controlo_razao: {pt: "Procedimento ligado ao apagamento de PRI-003; sem controlo técnico próprio no Manual.", en: "A procedure attached to the erasure in PRI-003; no dedicated technical control in the Manual."}
  - id: CTX-RGPD-R03
    contexto: CTX-RGPD
    grau: null
    niveis: null
    nome: {pt: "Verificação da idade e do consentimento parental", en: "Age and parental consent verification"}
    criterio_aceitacao:
      pt: "Quando um serviço da sociedade da informação é oferecido directamente a crianças com base em consentimento: a idade é verificada abaixo do limiar aplicável (16 anos, ou o limiar nacional, não inferior a 13) e o consentimento do titular das responsabilidades parentais é obtido e verificado com os meios adequados à tecnologia disponível, com registo em PRI-006."
      en: "Where an information society service is offered directly to children on the basis of consent: age is verified against the applicable threshold (16, or the national threshold, not below 13), and consent from the holder of parental responsibility is obtained and verified by means appropriate to the available technology, recorded under PRI-006."
    base:
      obrigacoes: [RGPD-8-2]
      referencia: "Reg. (UE) 2016/679, art. 8.º, n.º 2"
      citacao: {pt: "envida todos os esforços adequados para verificar que o consentimento foi dado ou autorizado pelo titular das responsabilidades parentais da criança", en: "shall make reasonable efforts to verify in such cases that consent is given or authorised by the holder of parental responsibility over the child"}
    controlos: []
    sem_controlo_razao: {pt: "O meio de verificação depende do serviço e da tecnologia disponível; sem controlo técnico próprio no Manual.", en: "The means of verification depends on the service and the available technology; no dedicated technical control in the Manual."}
  - id: CTX-RGPD-R04
    contexto: CTX-RGPD
    grau: null
    niveis: null
    nome: {pt: "Oposição por meios automatizados", en: "Objection by automated means"}
    criterio_aceitacao:
      pt: "Nos serviços da sociedade da informação, os sinais automatizados de oposição enviados pelo navegador ou pelo agente do utilizador (p. ex. Global Privacy Control) são reconhecidos e tratados como oposição válida, com o mesmo efeito da oposição dada pela interface (PRI-006)."
      en: "In information society services, automated objection signals sent by the browser or user agent (e.g. Global Privacy Control) are recognised and treated as a valid objection, with the same effect as an objection given through the interface (PRI-006)."
    base:
      obrigacoes: [RGPD-21-5]
      referencia: "Reg. (UE) 2016/679, art. 21.º, n.º 5"
      citacao: {pt: "o titular dos dados pode exercer o seu direito de oposição por meios automatizados, utilizando especificações técnicas", en: "the data subject may exercise his or her right to object by automated means using technical specifications"}
    controlos: []
    sem_controlo_razao: {pt: "Verificado em teste com PRI-006; sem controlo técnico próprio no Manual.", en: "Verified in testing together with PRI-006; no dedicated technical control in the Manual."}
  - id: CTX-RGPD-R05
    contexto: CTX-RGPD
    grau: null
    niveis: null
    nome: {pt: "Decisões exclusivamente automatizadas", en: "Solely automated decisions"}
    criterio_aceitacao:
      pt: "As decisões tomadas exclusivamente por tratamento automatizado, incluindo a definição de perfis, com efeitos jurídicos ou significativos para a pessoa estão identificadas no inventário; quando admitidas, a aplicação permite obter intervenção humana, manifestar o ponto de vista e contestar a decisão, e cada contestação fica registada com o resultado; estas decisões não usam categorias especiais de dados, salvo as excepções do art. 22.º, n.º 4."
      en: "Decisions taken solely by automated processing, including profiling, with legal or similarly significant effects on the person are identified in the inventory; where permitted, the application allows the person to obtain human intervention, express their point of view and contest the decision, and each challenge is logged with its outcome; these decisions do not use special categories of data, save for the exceptions of Article 22(4)."
    base:
      obrigacoes: [RGPD-22-1, RGPD-22-3, RGPD-22-4]
      referencia: "Reg. (UE) 2016/679, art. 22.º, n.os 1, 3 e 4"
      citacao: {pt: "o direito de, pelo menos, obter intervenção humana por parte do responsável, manifestar o seu ponto de vista e contestar a decisão", en: "at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision"}
    controlos: []
    sem_controlo_razao: {pt: "Capacidade funcional e de processo; sem controlo técnico próprio no Manual.", en: "A functional and process capability; no dedicated technical control in the Manual."}

