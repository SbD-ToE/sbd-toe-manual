  falta:
    pt: O Manual exige aprovação «pela direcção» do modelo de governação e das políticas e reporte de KPIs à gestão, mas não atribui ao órgão de direção a aprovação das medidas do art. 21.º como um todo, a supervisão da sua aplicação nem a responsabilização pessoal; o cross-check reconhece que «não fixa ex ante a forma jurídica exata da cadeia de aprovação».
    en: The Manual requires approval “by senior management” of the governance model and the policies, and reporting of KPIs to management, but does not assign to the management body the approval of the Article 21 measures as a whole, oversight of their implementation, or personal liability; the cross-check acknowledges that it “does not fix ex ante the exact legal form of the approval chain”.
