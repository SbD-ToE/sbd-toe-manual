- id: NIS2-IR2690-art1
  acto_fonte: 32024R2690
  referencia:
    pt: Reg. Exec. (UE) 2024/2690, art. 1.º
    en: Implementing Regulation (EU) 2024/2690, Article 1
  classe: organizacional
  forca: fora_de_ambito
  contexto: null
  resposta: []
  falta: null
  razao_fora_de_ambito:
    pt: Disposição de âmbito pessoal; não cria dever de engenharia.
    en: Provision on personal scope; it does not create an engineering duty.
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: '7.11.2024 (entrada em vigor: 20.º dia após publicação no JO, art. 16.º; sem data de aplicação diferida)'
  substitui: []
  nota:
    pt: 'Reg. de Execução (UE) 2024/2690: directamente aplicável desde 7.11.2024, mas apenas às entidades pertinentes do art. 1.º (DNS, registos TLD, nuvem, centros de dados, CDN, serviços geridos e de segurança gerida, mercados em linha, motores de pesquisa, redes sociais, serviços de confiança); para as restantes entidades NIS2 serve de referência de boas práticas. O modelo de classificação (CLA-001) não regista se a organização é entidade pertinente do Reg. Exec. — informação que decide se o anexo é vinculativo; o playbook NIS2 só sugere declarar essencial/importante.'
    en: 'Implementing Regulation (EU) 2024/2690: directly applicable since 7.11.2024, but only to the relevant entities of Article 1 (DNS, TLD registries, cloud, data centres, CDN, managed services and managed security services, online marketplaces, search engines, social networks, trust services); for the other NIS2 entities it serves as a good-practice reference. The classification model (CLA-001) does not record whether the organisation is a relevant entity under the Implementing Regulation — information that determines whether the annex is binding; the NIS2 playbook only suggests declaring essential/important.'
