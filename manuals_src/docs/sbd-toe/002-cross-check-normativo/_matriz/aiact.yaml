  acto_fonte: 32024R1689
  referencia: Art. 12.º, n.º 1
  classe: engenharia
  forca: parcial
  contexto:
    id: CTX-AIA-RE
    grau: null
  resposta:
  - tipo: requisito
    alvo: LOG-001
    niveis: [L1, L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: log
    citacao:
      pt: Acessos, alterações e falhas de segurança críticas são registados
      en: Access, changes and critical security failures are logged
  - tipo: requisito
    alvo: OPS-011
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/12-monitorizacao-operacoes/addon/00-catalogo-requisitos.md
    ancora: catálogo-ops---monitorização-e-operações
    citacao:
      pt: logging completo de inputs e outputs do modelo (com sanitização de PII)
      en: complete logging of model inputs and outputs (with PII sanitisation)
  - tipo: politica
    rotulo:
      pt: Política 29 §7
      en: Policy 29 §7
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 7-retenção-de-logs
    citacao:
      pt: Registos gerados automaticamente por sistemas de IA de risco elevado (OPS-011/012) | Pelo menos 6 meses
      en: Logs automatically generated by high-risk AI systems (OPS-011/012) | At least 6 months
  falta:
    pt: Logging genérico L1+ (LOG-001); o logging específico de IA (inputs/outputs, versões de modelo) só em L2/L3 (OPS-011).
    en: Generic L1+ logging (LOG-001); AI-specific logging (inputs/outputs, model versions) only at L2/L3 (OPS-011).
  razao_fora_de_ambito: null
  conflito: true
  explicacao_conflito:
    pt: 'CONFLITO (níveis): os requisitos específicos de IA (OPS-011/012, THR-008, ARC-014, DEP-011/012) só são exigidos em L2/L3 e o Cap. 01 declara que a IA «não cria novos eixos de risco» nem altera por si só a criticidade; não há regra que imponha a um sistema de IA de risco elevado (art. 6.º) um piso L2/L3. Um sistema de risco elevado classificado L1 (soma E+D+I ≤ 4) fica sem o requisito que a lei torna obrigatório.'
    en: 'CONFLICT (levels): the AI-specific requirements (OPS-011/012, THR-008, ARC-014, DEP-011/012) are required only at L2/L3 and Ch. 01 states that AI “does not create new risk axes” nor by itself alters criticality; there is no rule imposing an L2/L3 floor on a high-risk AI system (Article 6). A high-risk system classified L1 (sum E+D+I ≤ 4) is left without the requirement that the law makes mandatory.'
  confianca: alta
  aplicavel_desde: 2027-12-02 (anexo III) / 2028-08-02 (anexo I)
  substitui: [EXT-AI-ACT-OBL-12]
  nota: null
