  resposta:
  - tipo: requisito
    alvo: THR-003
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/03-threat-modeling/addon/00-catalogo-requisitos.md
    ancora: catálogo-thr---threat-modeling
    citacao:
      pt: LINDDUN em aplicações com fluxos de dados pessoais ou contexto de privacidade
      en: LINDDUN in applications with personal data flows or a privacy context
  - tipo: us
    alvo: 03-threat-modeling-us-08
    rotulo:
      pt: Cap. 03 US-08
      en: Ch. 03 US-08
    ficheiro: 010-sbd-manual/03-threat-modeling/aplicacao-lifecycle.md
    ancora: us-08---aplicação-linddun-quando-existir-tratamento-de-dados-pessoais--novo
    citacao:
      pt: mapeamento para os requisitos de privacidade do Cap. 02
      en: mapping to the privacy requirements of Ch. 02
  - tipo: pagina
    rotulo:
      pt: O método
      en: The method
    ficheiro: 010-sbd-manual/03-threat-modeling/addon/13-linddun-privacidade.md
    ancora: o-método
    citacao:
      pt: derivar requisitos de privacidade e medidas de mitigação — minimização, anonimização, consentimento, transparência
      en: derive privacy requirements and mitigation measures — minimisation, anonymisation, consent, transparency
  - tipo: requisito
    alvo: PRI-001
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: pri
    citacao:
      pt: Cada campo de dados pessoais recolhido está associado a uma finalidade registada; campos sem finalidade são removidos do fluxo de recolha
      en: Each personal-data field collected is associated with a recorded purpose; fields without a purpose are removed from the collection flow
  - tipo: requisito
    alvo: ERR-007
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: err
    citacao:
      pt: dados pessoais ou credenciais nunca registados em logs de erro
      en: personal data or credentials are never recorded in error logs
  falta:
    pt: 'Privacidade desde a conceção prescrita em L2/L3 (LINDDUN com ligação a PRI-001…005, pseudonimização em logs de erro); os requisitos PRI-* só se aplicam a L2/L3, mas uma aplicação interna com dados pessoais e impacto baixo soma E1+D2+I1 = 4 → L1, e fica sem requisito de privacidade (o RGPD aplica-se independentemente do nível). Inconsistência de nível: THR-003 e o cap. 03 US-08 tornam o LINDDUN obrigatório em L2 quando há dados pessoais, mas a Política 08 §11 marca-o só «Recomendado» em L2. Sem catálogo de padrões de privacidade (pseudonimização/anonimização como padrão arquitetural).'
    en: 'Privacy by design prescribed at L2/L3 (LINDDUN linked to PRI-001…005, pseudonymisation in error logs); the PRI-* requirements apply only to L2/L3, but an internal application with personal data and low impact scores E1+D2+I1 = 4 → L1, and is left without any privacy requirement (the GDPR applies regardless of the level). Level inconsistency: THR-003 and Ch. 03 US-08 make LINDDUN mandatory at L2 when there is personal data, but Policy 08 §11 marks it only “Recommended” at L2. No catalogue of privacy patterns (pseudonymisation/anonymisation as an architectural pattern).'
