# Contextos regulatórios — overlay regulatório do Manual (schema sbdtoe-overlay/1, tipo_overlay: regulatorio).
#
# O núcleo do Manual é agnóstico à regulação: os requisitos definem-se só nos catálogos (master). Este ficheiro é um overlay:
# uma selecção por ids sobre o master, com três operações — selecionar (a selecção base do nível), elevar (pisos) e
# acrescentar (requisitos que só fazem sentido sob o regime, CTX-<regime>-Rnn). Um overlay regulatório nunca remove nem baixa
# um mínimo do Manual; «remover» só existe em overlays de organização (Tier C, fora deste repositório).
#
# - Pisos: autoria do Manual agent, com base nas matrizes _matriz/<acto>.yaml (ids de obrigação estáveis) e no texto oficial
#   sic em translation/sources/eurlex/. As citações PT e EN são recortes literais dos textos EUR-Lex (verificados por script).
# - niveis: null = todos os níveis (em pisos e acrescentos). controlos (acrescentos): [] com sem_controlo_razao, ou control_id
#   publicados no KG (CTRL-<domínio>-<slug>-<hash>, controls.json).
# - lista_ids (fim do ficheiro): GERADA por scripts/gen_reg_views.py a partir dos catálogos e dos pisos; verificada no CI por
#   scripts/check_reg_context.py. Não editar à mão.
# - Páginas «Requisitos aplicáveis» (002-cross-check-normativo/<acto>/): vistas geradas deste ficheiro (sbdtoe_generated).
schema: sbdtoe-overlay/1
tipo_overlay: regulatorio
version: 1
decided: "2026-09-27"

vocabulario:
  forca:
    - {id: cobre, nome: {pt: Cobre, en: Covers}, descricao: {pt: "O Manual prescreve o mesmo objecto com força comparável.", en: "The Manual prescribes the same object with comparable force."}}
    - {id: parcial, nome: {pt: Parcial, en: Partial}, descricao: {pt: "O Manual cobre parte do dever; o que falta está em «falta».", en: "The Manual covers part of the duty; what is missing is in “falta”."}}
    - {id: apoia_evidencia, nome: {pt: Apoia evidência, en: Supports evidence}, descricao: {pt: "O Manual produz evidência de engenharia para um dever de outro plano; nunca conta como cobertura.", en: "The Manual produces engineering evidence for a duty on another plane; it never counts as coverage."}}
    - {id: lacuna, nome: {pt: Lacuna, en: Gap}, descricao: {pt: "O Manual deveria cobrir e não cobre.", en: "The Manual should cover it and does not."}}
    - {id: fora_de_ambito, nome: {pt: Fora de âmbito, en: Out of scope}, descricao: {pt: "Legitimamente fora de um manual de engenharia de segurança de software; a razão está declarada.", en: "Legitimately outside a software security engineering manual; the reason is declared."}}
  classe:
    - {id: engenharia, nome: {pt: Engenharia, en: Engineering}}
    - {id: organizacional, nome: {pt: Organizacional, en: Organisational}}
    - {id: juridico-contratual, nome: {pt: Jurídico-contratual, en: Legal and contractual}}
  confianca:
    - {id: alta, nome: {pt: Alta, en: High}}
    - {id: media, nome: {pt: Média, en: Medium}}
    - {id: baixa, nome: {pt: Baixa, en: Low}}
  tipo:
    - {id: requisito, nome: {pt: Requisito, en: Requirement}, chave: alvo}
    - {id: us, nome: {pt: User story, en: User story}, chave: alvo}
    - {id: politica, nome: {pt: Política, en: Policy}, chave: ficheiro+ancora}
    - {id: pagina, nome: {pt: Secção do Manual, en: Manual section}, chave: ficheiro+ancora}
    - {id: acrescento, nome: {pt: Requisito acrescentado pelo regime, en: Requirement added by the regime}, chave: alvo}
  operador:
    - {id: selecionar, nome: {pt: Selecionar, en: Select}, descricao: {pt: "Ids do master que se aplicam em cada nível (selecção base).", en: "Master ids that apply at each level (base selection)."}}
    - {id: elevar, nome: {pt: Elevar, en: Elevate}, descricao: {pt: "Torna obrigatório ou fixa um parâmetro num id do master; nunca baixa um mínimo.", en: "Makes a master id mandatory or fixes a parameter on it; never lowers a minimum."}}
    - {id: acrescentar, nome: {pt: Acrescentar, en: Add}, descricao: {pt: "Requisito novo com id no espaço do overlay (CTX-<regime>-Rnn), só para o que faz sentido apenas sob o regime.", en: "New requirement with an id in the overlay's space (CTX-<regime>-Rnn), only for what makes sense solely under the regime."}}
    - {id: remover, nome: {pt: Remover, en: Remove}, descricao: {pt: "Só em overlays de organização, com governança registada; proibido em overlays regulatórios.", en: "Only in organisation overlays, with recorded governance; forbidden in regulatory overlays."}}
  escalas:
    frequencia:
      tipo: ordinal
      ordem: [anual, semestral, trimestral, mensal, quinzenal, semanal, diaria, continua]  # do menos para o mais exigente
      nomes:
        anual: {pt: anual, en: annual}
        semestral: {pt: semestral, en: half-yearly}
        trimestral: {pt: trimestral, en: quarterly}
        mensal: {pt: mensal, en: monthly}
        quinzenal: {pt: quinzenal, en: fortnightly}
        semanal: {pt: semanal, en: weekly}
        diaria: {pt: diária, en: daily}
        continua: {pt: contínua, en: continuous}
    retencao:
      tipo: quantidade
      unidade: meses
  unidades:
    - {id: meses, nome: {pt: meses, en: months}}
  sentido:
    - {id: min, descricao: {pt: "O valor efectivo tem de ser pelo menos o do piso (na escala ou na unidade).", en: "The effective value must be at least the floor's (on the scale or in the unit)."}}
    - {id: max, descricao: {pt: "O valor efectivo não pode exceder o do piso.", en: "The effective value must not exceed the floor's."}}

regra_lista:
  versao: 1
  passos:
    - {pt: "Selecção base do nível Lx: todos os ids do master (catálogos do cap. 02 e específicos dos caps. 01 e 03–14) marcados ✔ na coluna Lx, com origem «base» e, se não forem do cap. 02, o capítulo em «cap».", en: "Base selection for level Lx: all master ids (Ch. 02 catalogues and the chapter-specific ones of Ch. 01 and 03–14) marked ✔ in column Lx, with origin “base” and, when not from Ch. 02, the chapter in “cap”."}
    - {pt: "Lista do contexto (chave «base»): selecção base ∪ ids-alvo dos pisos sem grau cujo «niveis» inclui Lx; um id com piso aplicável passa a origem «elevado», com os ids dos pisos e as obrigações da base.", en: "Context list (key “base”): base selection ∪ target id of each floor without a grade whose “niveis” include Lx; an id with an applicable floor gets origin “elevado”, with the floor ids and the obligations of the basis."}
    - {pt: "Lista de um grau cumulativo: lista «base» do contexto ∪ pisos desse grau. Lista de um grau não cumulativo (declarável sozinho): selecção base ∪ pisos desse grau.", en: "List for a cumulative grade: the context's “base” list ∪ each floor of that grade. List for a non-cumulative grade (declarable on its own): base selection ∪ each floor of that grade."}
    - {pt: "Acrescentos (CTX-<regime>-Rnn) entram com origem «acrescentado» nos níveis e graus que declaram.", en: "Additions (CTX-<regime>-Rnn) enter with origin “acrescentado” at the levels and grades they declare."}
    - {pt: "Pisos sobre políticas não entram na lista (não são ids do master); ficam em «pisos» com ficheiro e âncora.", en: "A floor on a policy does not enter the list (it is not a master id); it stays in “pisos” with file and anchor."}
  activacao:
    pt: "Requisitos efectivos = selecção técnica ∪ elevados ∪ acrescentados. Os ids de origem «base» só entram se a selecção técnica (contexto técnico da aplicação) os activar. Um id elevado ou acrescentado sem activação técnica não cai em silêncio: entra marcado «aplica-se pelo regime; se o componente não existir, exige justificação documentada de não aplicabilidade» (modelo do Reg. de Execução (UE) 2024/2690, art. 2.º)."
    en: "Effective requirements = technical selection ∪ elevated ∪ added. Ids with origin “base” enter only if the technical selection (the application's technical context) activates them. An elevated or added id without technical activation is not dropped silently: it enters flagged “applies by the regime; if the component does not exist, a documented justification of non-applicability is required” (model of Implementing Regulation (EU) 2024/2690, Article 2)."
  mais_exigente:
    pt: "Quando dois pisos-parâmetro do mesmo alvo colidem, prevalece o mais exigente pela escala ou unidade e pelo sentido. O valor efectivo calcula-o o KG; este ficheiro e as páginas geradas mostram todos os pisos, cada um com a sua base."
    en: "When two parameter floors on the same target collide, the more demanding one prevails, by scale or unit and by direction. The KG computes the effective value; this file and the generated pages show every floor, each with its basis."

graus:
  - id: FCI
    contexto: CTX-DORA
    nome: {pt: Suporta função crítica ou importante, en: Supports a critical or important function}
    declara_se_em: aplicacao
    cumulativo: true
    criterio:
      obrigacoes: [DORA-8-1]
      referencia: "Reg. (UE) 2022/2554, art. 8.º, n.º 1"
      citacao:
        pt: "as entidades financeiras identificam, classificam e documentam adequadamente todas as funções operacionais apoiadas pelas TIC"
        en: "identify, classify and adequately document all ICT supported business functions"
      texto:
        pt: A aplicação suporta uma função crítica ou importante no inventário de funções da entidade financeira; declara-se por aplicação, com remissão para esse inventário.
        en: The application supports a critical or important function in the financial entity's inventory of functions; declared per application, with a reference to that inventory.
  - id: PERTINENTE
    contexto: CTX-NIS2
    nome: {pt: Entidade pertinente do Reg. de Execução (UE) 2024/2690, en: Relevant entity under Implementing Regulation (EU) 2024/2690}
    declara_se_em: entidade
    cumulativo: true
    criterio:
      obrigacoes: []
      referencia: "Reg. de Execução (UE) 2024/2690, art. 1.º"
      citacao:
        pt: "O presente regulamento estabelece os requisitos técnicos e metodológicos das medidas referidas no artigo 21.o, n.o 2, da Diretiva (UE) 2022/2555"
        en: "lays down the technical and the methodological requirements of the measures referred to in Article 21"
      texto:
        pt: "A entidade é de um dos tipos enumerados no art. 1.º do Reg. de Execução (UE) 2024/2690 (prestadores de DNS, registos de TLD, computação em nuvem, centros de dados, redes de distribuição de conteúdos, serviços geridos e de segurança gerida, mercados em linha, motores de pesquisa, redes sociais, serviços de confiança)."
        en: "The entity is of one of the types listed in Article 1 of Implementing Regulation (EU) 2024/2690 (DNS service providers, TLD name registries, cloud computing, data centres, content delivery networks, managed and managed security services, online marketplaces, search engines, social networks, trust services)."
  - id: ART50
    contexto: CTX-AIA-RE
    nome: {pt: Abrangido pelo art. 50.º (transparência), en: Covered by Article 50 (transparency)}
    declara_se_em: aplicacao
    cumulativo: false   # declarável sozinho: um sistema só abrangido pelo art. 50.º não recebe os pisos de risco elevado
    criterio:
      obrigacoes: [AIA-50-1, AIA-50-2, AIA-50-4-a, AIA-50-5]
      referencia: "Reg. (UE) 2024/1689, art. 50.º"
      citacao:
        pt: "Os prestadores devem assegurar que os sistemas de IA destinados a interagir diretamente com pessoas singulares sejam concebidos e desenvolvidos de maneira que as pessoas singulares em causa sejam informadas de que estão a interagir com um sistema de IA"
        en: "Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system"
      texto:
        pt: Sistema de IA abrangido pelas obrigações de transparência do art. 50.º (interacção directa com pessoas singulares, conteúdo sintético, falsificações profundas), seja ou não de risco elevado.
        en: AI system covered by the transparency obligations of Article 50 (direct interaction with natural persons, synthetic content, deep fakes), whether or not it is high-risk.

