        ambito: {pt: "Ponto de contacto único, facilmente identificável e indicado nas informações e instruções ao utilizador (anexo II); endereço de contacto também para vulnerabilidades em componentes de terceiros.", en: "Single point of contact, easily identifiable and included in the information and instructions to the user (Annex II); contact address also for vulnerabilities in third-party components."}
        base:
          obrigacoes: [CRA-AnxI-P2-5, CRA-AnxI-P2-6, CRA-13-17, CRA-AnxII-2]
          referencia: "Reg. (UE) 2024/2847, anexo I, parte II, pontos 5 e 6; art. 13.º, n.º 17; anexo II, ponto 2"
          citacao: {pt: "Definir e aplicar uma política de divulgação coordenada de vulnerabilidades", en: "put in place and enforce a policy on coordinated vulnerability disclosure"}
        admite_justificacao: false

  - id: CTX-AIA-RE
    nome: {pt: Sistema de IA de risco elevado (AI Act), en: High-risk AI system (AI Act)}
    acto_fonte: [32024R1689]
    versao_consolidada: 02024R1689-20260727
    matriz: _matriz/aiact.yaml
    declara_se_em: aplicacao
    graus_admitidos: [ART50]
    criterio:
      obrigacoes: [AIA-6-1, AIA-6-2-3]
      referencia: "Reg. (UE) 2024/1689, art. 6.º, n.os 1 a 3"
      citacao:
        pt: "os sistemas de IA a que se refere o anexo III são também considerados de risco elevado"
        en: "AI systems referred to in Annex III shall be considered to be high-risk"
      texto:
        pt: O sistema de IA é de risco elevado nos termos do art. 6.º (com a qualificação jurídica anexada à declaração). Os pisos sem grau aplicam-se a sistemas de risco elevado; o grau ART50 declara-se também sozinho, para sistemas só abrangidos pelo art. 50.º. Nível L3 não equivale a risco elevado.
        en: The AI system is high-risk under Article 6 (with the legal qualification attached to the declaration). A floor without a grade applies to high-risk systems; the ART50 grade can also be declared on its own, for systems covered only by Article 50. Risk level L3 is not the same as high-risk.
    pisos:
      - id: CTX-AIA-RE-P01
        alvo: {tipo: requisito, alvo: OPS-011}
        grau: null
        niveis: null
        operador: elevar
        piso: {obrigatorio: true}
        ambito: null
        base:
          obrigacoes: [AIA-12-1, AIA-12-2]
          referencia: "Reg. (UE) 2024/1689, art. 12.º, n.os 1 e 2"
          citacao: {pt: "Os sistemas de IA de risco elevado devem permitir tecnicamente o registo automático de eventos («registos») durante a vida útil do sistema.", en: "High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system."}
        admite_justificacao: false
      - id: CTX-AIA-RE-P02
