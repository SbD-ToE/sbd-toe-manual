    pt: 'CONFLITO (níveis): os requisitos específicos de IA (OPS-011/012, THR-008, ARC-014, DEP-011/012) só são exigidos em L2/L3 e o Cap. 01 declara que a IA «não cria novos eixos de risco» nem altera por si só a criticidade; não há regra que imponha a um sistema de IA de risco elevado (art. 6.º) um piso L2/L3. Um sistema de risco elevado classificado L1 (soma E+D+I ≤ 4) fica sem o requisito que a lei torna obrigatório.'
