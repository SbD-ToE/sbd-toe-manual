achados:
- id: A1
  tipo: colisao-de-sentido-programa
  termo: traversal
  resumo: 'Papers: algoritmo de retrieval por grafo (P3/P4/P5). Ontologia v2.6: «travessia» = espécie de relação
    N:M entre segmentações — e a v2.6 JÁ usa as chaves EN `segmentation_traversals` / `sdlc_phase_traversal` (linhas
    710, 3461 do YAML v2.6). Colisão EN-vs-EN dentro do programa, não só PT-vs-EN. Manual: «path traversal» (ataque).
    Registo: pending.'
- id: A2
  tipo: dois-sentidos-nos-papers
  termo: artifact / artefact
  resumo: 'Três sentidos: tipo de entidade ACA (Artifact), artefacto de investigação/DSR (artefact), e «traceability
    artifact» (lacuna aparente, P2/P5). P6/P7 codificam tipo-vs-genérico pela ORTOGRAFIA (Artifact 23+9 vs artefact
    72+44); P0–P5 usam «artifact» para tudo (0 «artefact»). Decisão ortográfica ao lead.'
- id: A3
  tipo: dois-sentidos-nos-papers
  termo: substrate
  resumo: 'P2/P3: integration/retrieval substrate = a ontologia. P7 (126 ocorr.): substrate v7 = produto de dados
    do ciclo (3.861 itens / 18.673 claims). v2.6: «substrato» = a coisa segmentada por MP/capítulo/fase. Três referentes.'
- id: A4
  tipo: dois-sentidos-nos-papers
  termo: promotion
  resumo: ACR promotion (admissão à ontologia, P6/P7) vs Release Promotion (slice ASC-09, release engineering, P1/P6)
    vs promoção de ficheiro no mirror (P5). «promoção» no Manual (271) = release.
- id: A5
  tipo: dois-sentidos-nos-papers
  termo: apparatus
  resumo: Aparato experimental MCP (P0/P4/P5) vs «SHACL apparatus» = conjunto de constraints (P6/P7).
- id: A6
  tipo: dois-sentidos-nos-papers
  termo: completeness
  resumo: Invariante de completude do retrieval (P3/P4/P5) vs completude iterativa do Manual (P7) vs domain completeness
    negada (P2 §7.3).
- id: A7
  tipo: dois-sentidos-nos-papers
  termo: baseline
  resumo: Condição experimental G0/RAG baseline (P4/P5) vs estado de partida v0/first-wave/`ontology-v1.1-fair-baseline`
    (P6/P7) vs secure configuration baseline (ACR-001, controlo). Manual usa «baseline» sem tradução (309).
- id: A8
  tipo: dois-sentidos-nos-papers
  termo: tier
  resumo: Tier de curadoria por fonte (P7, Tier 1–4) vs Tier A–F de ferramentas do oráculo (P4).
- id: A9
  tipo: dois-sentidos-nos-papers
  termo: pilot
  resumo: Pilot = registo de uma fonte no modelo de compilação (P2/P6/P7) vs pilot scoring session (P4, genérico).
- id: A10
  tipo: dois-sentidos-nos-papers
  termo: practice / mechanism / signal / claim / control / composite / framework / gate
  resumo: Tipo de entidade vs uso genérico (practice, mechanism, signal); claim científico vs normalized claim (unidade
    de dados); controlo de segurança vs factor controlado; objectivo composto vs tarefa composta; framework = norma
    (P1/P7) vs evaluation framework (título P4); gate de release vs gate de governação. Todos borrowed; a maiúscula
    só distingue parcialmente.
- id: A11
  tipo: dois-sentidos-nos-papers
  termo: grounding
  resumo: LLM grounding (dominante) vs grounding metodológico da investigação (P0, Engström) vs substrate-grounding/lexical
    grounding (P6:221; v2.6 source_mode scored).
- id: A12
  tipo: polissemia-por-objecto
  termo: contract
  resumo: Slice contract (P1/P6), retrieval contract (P3/P5), manual-mapping contract (P5), consumer contract (artefacto
    P3) — mesmo género, objectos distintos; o registo deve entrar cada um como termo próprio.
- id: A13
  tipo: colisao-com-v2.6
  termo: view / vista
  resumo: 'Papers: engagement view vs organizational view (two-view architecture, P6/P7). v2.6: «vista» = eixo de
    segmentação (vista processual 15 capítulos; vista de fases 8). Sentidos distintos sob a mesma palavra.'
- id: A14
  tipo: colisao-com-v2.6
  termo: bundle
  resumo: 'Papers: deposited bundle (depósito de artefactos, P6/P7) e bundled intervention (P5). v2.6: KnowledgeBundle
    = capítulo. Manual: «bundle» 24.'
- id: A15
  tipo: colisao-com-v2.6
  termo: gap / absence / deferred / out of scope / mandatory / closure / floor / dependency
  resumo: Tipologia de lacunas de P2 (claim/content/cross-reference) ≠ absence_model v2.6 (gap|out_of_scope|deferred|elsewhere).
    «deferred», «out of scope», «mandatory», «closure», «floor», «dependency» existem nos papers em sentido genérico/outro;
    na v2.6 são valores tipados ou espécies de relação (piso, dependência, fecho). Falsos amigos a evitar na escolha
    do EN da Espécie 2.
- id: A16
  tipo: ortografia
  termo: -ization / -isation
  resumo: P0/P1/P2/P3/P7 usam -ization (AmE); P4/P5 usam -isation (BrE); P6 mistura (19/6). Mesma oscilação em artifact/artefact
    (ver A2). Decisão de variante de inglês (International English) ao lead.
- id: A17
  tipo: renomeacao-interna
  termo: structural resilience → schema preservation; P1 companion → P6
  resumo: P0 usa «structural resilience» (16) e «P1 companion» (62) para o que P6 publica como «schema preservation
    under multi-source pressure»; P0 é emendável (não registado no OSF) — candidato a nota de actualização.
- id: A18
  tipo: especie-2-verificada
  termo: typed absence · declared absence · prescription reach · operational mandate · segmentation principle ·
    closure rule · ledger precedence · macro-process
  resumo: '0 ocorrências nos manuscritos P0–P7 (verificado por grep). Confirma a Espécie 2 do épico: sem antecedente
    EN nos papers. Únicos vizinhos: «floor» (7, admissibility floor), «dependency» (15, supply-chain/lógica), «containment»
    (2, hallucination-containment), «absence» (32, genérico).'
- id: A19
  tipo: reconciliacao-de-contagem
  termo: slice · grounding · coverage-preserving · control objective · traversal
  resumo: 'As contagens do Orchestrator reproduzem-se como substring em md+tex+txt de papers/00..08 (inclui P8,
    o duplicado arxiv/main.tex e READMEs): slice 1067 ✓, grounding 209 ✓, coverage-preserving 84 (≈85), control
    objective 28 ✓, traversal 19 ✓. Nos 9 manuscritos-fonte P0–P7 (sem duplicados; substring): slice 512 (417 como
    palavra isolada), grounding 107, coverage-preserving 46, control objective 12 (+145 na forma CamelCase ControlObjective,
    entrada própria), traversal 18. Ver tabela reconciliacao_contagens.'
- id: A20
  tipo: termos-em-titulo
  termo: ontology-grounded · coverage-preserving · normalized ontology · bounded-ontology · pressure-testing · design
    science cycle · MCP instrument · transparent · auditable · security-by-design · evaluation framework · heterogeneous
    frameworks/sources
  resumo: Termos presentes em títulos de papers com DOI (custo de mudança máximo). Ver coluna em_titulo/titulo_doi.
