    ancora: pri
    citacao:
      pt: Existe mecanismo testado para apagar e para exportar os dados pessoais de um titular identificado, sem intervenção manual em base de dados
      en: A tested mechanism exists to delete and to export the personal data of an identified data subject, without manual intervention in the database
  - tipo: politica
    rotulo:
      pt: Política 18 §10.7
      en: Policy 18 §10.7
    ficheiro: 020-assets/policies/18_policy-gestao-segredos.md
    ancora: 107-proporcionalidade
    citacao:
      pt: Procedimento para direitos do titular | Recomendado | Obrigatório
      en: Procedure for data subject rights | Recommended | Mandatory
  - tipo: politica
    rotulo:
      pt: Política 18 §10.6
      en: Policy 18 §10.6
    ficheiro: 020-assets/policies/18_policy-gestao-segredos.md
    ancora: 106-direitos-do-titular-dos-dados
    citacao:
      pt: aplicam-se os direitos do RGPD (acesso Art. 15.º, rectificação Art. 16.º, apagamento Art. 17.º, oposição Art. 21.º)
      en: the GDPR rights apply (access Art. 15, rectification Art. 16, erasure Art. 17, objection Art. 21)
  falta:
    pt: Existe capacidade técnica de apagar/exportar (L2/L3) e, na fatia de IA, procedimento de direitos obrigatório em L2/L3; faltam canal de pedidos, retificação, limitação, oposição e portabilidade estruturada, e L1.
    en: There is a technical capability to erase/export (L2/L3) and, in the AI slice, a rights procedure mandatory at L2/L3; a request channel, rectification, restriction, objection and structured portability are missing, as is L1.
  razao_fora_de_ambito: null
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 25.5.2018 (art. 99.º, n.º 2)
  substitui: []
  nota:
    pt: 'A delimitação «direitos formais → lado legal» do cap. 02 remete para o cross-check RGPD, que por sua vez remete para DPO/GRC («Base legal, finalidades, direitos | Matéria jurídica»): a capacidade técnica que suporta os direitos fica sem dono prescritivo fora de PRI-003.'
    en: 'The Ch. 02 delimitation “formal rights → legal side” refers to the GDPR cross-check, which in turn refers to DPO/GRC (“Legal basis, purposes, rights | Legal matter”): the technical capability supporting the rights is left without a prescriptive owner outside PRI-003.'
