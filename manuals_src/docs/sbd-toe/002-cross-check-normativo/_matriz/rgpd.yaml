    ancora: pri
    citacao:
      pt: Existe mecanismo testado para apagar e para exportar os dados pessoais de um titular identificado, sem intervenção manual em base de dados
      en: A tested mechanism exists to delete and to export the personal data of an identified data subject, without manual intervention in the database
  - tipo: politica
    rotulo:
      pt: Política 18 §10.6
      en: Policy 18 §10.6
    ficheiro: 020-assets/policies/18_policy-gestao-segredos.md
    ancora: 106-direitos-do-titular-dos-dados
    citacao:
      pt: quando o titular exerce direito ao esquecimento (sujeito a obrigações legais de retenção concorrentes)
      en: when the data subject exercises the right to be forgotten (subject to competing legal retention obligations)
  - tipo: politica
    rotulo:
      pt: Política 29 §8
      en: Policy 29 §8
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 8-integridade-e-imutabilidade
    citacao:
      pt: Armazenamento WORM (Write Once, Read Many)
      en: WORM storage (Write Once, Read Many)
  falta:
    pt: Apagamento testado do titular (L2/L3) e dos audit events de IA; não abrange explicitamente backups, réplicas, caches, logs e sistemas a jusante, nem L1.
    en: Tested erasure of the data subject (L2/L3) and of AI audit events; it does not explicitly cover backups, replicas, caches, logs and downstream systems, nor L1.
  razao_fora_de_ambito: null
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 25.5.2018 (art. 99.º, n.º 2)
  substitui: []
  nota:
    pt: 'Tensão interna: a Política 18 §10.6 exige apagar audit events sob controlo do deployer quando o titular exerce o direito, enquanto a Política 29 §8 torna obrigatório em L3 o armazenamento WORM de logs que contêm user.id e src.ip. Não é contradição com a lei (o art. 17.º, n.º 3, admite conservar para cumprimento de obrigação legal ou defesa em juízo), mas o Manual não diz qual das regras prevalece nem exige pseudonimização dos identificadores em armazenamento imutável.'
    en: 'Internal tension: Policy 18 §10.6 requires erasing audit events under the deployer''s control when the data subject exercises the right, while Policy 29 §8 makes WORM storage of logs containing user.id and src.ip mandatory at L3. This is not a contradiction with the law (Article 17(3) allows retention for compliance with a legal obligation or for the defence of legal claims), but the Manual does not say which rule prevails nor require pseudonymisation of identifiers in immutable storage.'
