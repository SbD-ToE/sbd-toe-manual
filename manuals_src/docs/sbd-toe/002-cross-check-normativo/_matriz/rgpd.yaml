    ancora: pri
    citacao:
      pt: Inventário associa cada conjunto de dados pessoais à finalidade e ao sistema que o trata; alterações de finalidade são registadas
      en: An inventory associates each personal-data set with its purpose and the system that processes it; changes of purpose are recorded
  - tipo: requisito
    alvo: PRI-001
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: pri
    citacao:
      pt: Cada campo de dados pessoais recolhido está associado a uma finalidade registada; campos sem finalidade são removidos do fluxo de recolha
      en: Each personal-data field collected is associated with a recorded purpose; fields without a purpose are removed from the collection flow
  falta: null
  razao_fora_de_ambito: null
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 25.5.2018 (art. 99.º, n.º 2)
  substitui: [EXT-RGPD-OBL-5]
  nota:
    pt: O Manual regista a finalidade por conjunto de dados e por campo e regista alterações de finalidade — evidência de engenharia; a determinação da finalidade legítima e o juízo de compatibilidade são jurídicos.
    en: The Manual records the purpose per dataset and per field and records changes of purpose — engineering evidence; determining the legitimate purpose and the compatibility judgement are legal.
- id: RGPD-5-1-c
  acto_fonte: 32016R0679
  referencia: Art. 5.º, n.º 1, alínea c)
  classe: engenharia
  forca: parcial
  contexto: null
  resposta:
  - tipo: requisito
    alvo: PRI-001
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: pri
    citacao:
      pt: Cada campo de dados pessoais recolhido está associado a uma finalidade registada; campos sem finalidade são removidos do fluxo de recolha
      en: Each personal-data field collected is associated with a recorded purpose; fields without a purpose are removed from the collection flow
  - tipo: requisito
    alvo: PRI-005
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: pri
    citacao:
      pt: Existe um conceito documentado de tratamento de PII em registos (o que se regista, mascarado como, por quanto tempo)
      en: A documented concept for handling PII in logs exists (what is logged, masked how, for how long)
  - tipo: politica
    rotulo:
      pt: Política 29 §5
      en: Policy 29 §5
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 5-proibições-absolutas-nos-logs
    citacao:
      pt: PII directamente identificável (nome completo + morada + NIF)
      en: Directly identifiable PII (full name + address + tax ID number)
  - tipo: politica
    rotulo:
      pt: Política 29 §3.2
      en: Policy 29 §3.2
    ficheiro: 020-assets/policies/29_policy-logging-estruturado.md
    ancora: 32-schema-mínimo-de-evento
    citacao:
      pt: interno, nunca email ou nome
      en: internal, never email or name
  - tipo: requisito
    alvo: ENC-005
    niveis: [L1, L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: enc
    citacao:
      pt: Passwords, tokens, números de cartão, dados pessoais sensíveis não aparecem em claro em logs
      en: Passwords, tokens, card numbers and sensitive personal data do not appear in clear text in logs
  - tipo: politica
    rotulo:
      pt: Política 18 §10.1
      en: Policy 18 §10.1
    ficheiro: 020-assets/policies/18_policy-gestao-segredos.md
    ancora: 101-princípio-de-minimização
    citacao:
      pt: Redacção / pseudonimização antes do envio
      en: Redaction / pseudonymisation before sending
  falta:
    pt: Minimização prescrita em L2/L3 (PRI-001) e, em todos os níveis, só nos logs (Política 29 §5, ENC-005); os requisitos PRI-* só se aplicam a L2/L3, mas uma aplicação interna com dados pessoais e impacto baixo soma E1+D2+I1 = 4 → L1, e fica sem requisito de privacidade (o RGPD aplica-se independentemente do nível). Telemetria e esquemas de dados fora de logs/prompts sem regra em L1.
    en: Minimisation prescribed at L2/L3 (PRI-001) and, at all levels, only in logs (Policy 29 §5, ENC-005); the PRI-* requirements apply only to L2/L3, but an internal application with personal data and low impact scores E1+D2+I1 = 4 → L1, and is left without any privacy requirement (the GDPR applies regardless of the level). Telemetry and data schemas outside logs/prompts have no rule at L1.
  razao_fora_de_ambito: null
  conflito: false
