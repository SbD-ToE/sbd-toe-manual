  razao_fora_de_ambito:
    pt: Relação administrativa com a autoridade competente/ENISA (registo, notificação de dados de identificação, supervisão ou regime sancionatório); plano jurídico-administrativo, não de engenharia de segurança.
    en: Administrative relationship with the competent authority/ENISA (registration, notification of identification data, supervision or penalty regime); legal-administrative plane, not security engineering.
  conflito: false
  explicacao_conflito: null
  confianca: alta
  aplicavel_desde: 18.10.2024 (art. 41.º — aplicação das medidas nacionais de transposição)
  substitui: []
  nota:
    pt: 'Dever da Diretiva (UE) 2022/2555: aplica-se às entidades essenciais e importantes através da transposição nacional (em Portugal, o regime jurídico da cibersegurança que a transpõe); o texto nacional pode concretizar ou acrescentar. Apoio indirecto: o inventário (CLA-008, ARC-002) pode alimentar a lista, mas não inclui gamas de endereços IP nem contactos institucionais.'
    en: 'Obligation under Directive (EU) 2022/2555: it applies to essential entities and important entities through national transposition (in Portugal, the national cybersecurity legal framework that transposes it); the national text may specify or add to it. Indirect support: the inventory (CLA-008, ARC-002) can feed the list, but does not include IP address ranges or institutional contacts.'
