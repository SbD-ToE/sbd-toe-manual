  acto_fonte: 32016R0679
  referencia: Art. 5.º, n.º 1, alínea d)
  classe: engenharia
  forca: lacuna
  contexto: null
  resposta: []
  falta:
    pt: Nenhum requisito sobre exatidão/atualização dos dados pessoais nem capacidade técnica de retificação (PRI-003 só prevê apagar e exportar).
    en: No requirement on the accuracy/updating of personal data nor on a technical rectification capability (PRI-003 only provides for erasure and export).
  razao_fora_de_ambito: null
  conflito: false
