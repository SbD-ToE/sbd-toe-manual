  nota:
    pt: 'Certificação voluntária salvo imposição do direito da União/nacional (CSA art. 56.º, n.º 2); o dever só se constitui para quem requer/detém certificado EUCC ou emite declaração UE de conformidade. Tensão: a Política 12 admite «Fix deferred»/«Risk accepted» para CVE Critical (7 dias em L1/L2) e High (até 90 dias em L1), e a Política 20 §5.1 bloqueia só sem «exceção formal válida» — um produto a certificar tem de demonstrar ausência de vulnerabilidades conhecidas na avaliação.'
    en: 'Certification is voluntary unless required by Union/national law (CSA Article 56(2)); the duty arises only for those who apply for/hold an EUCC certificate or issue an EU statement of conformity. Tension: Policy 12 allows “Fix deferred”/“Risk accepted” for Critical CVEs (7 days at L1/L2) and High (up to 90 days at L1), and Policy 20 §5.1 blocks only without a “valid formal exception” — a product to be certified must demonstrate the absence of known vulnerabilities in the evaluation.'
