  falta:
    pt: O modelo de classificação do Manual (eixos E/D/I → L1–L3, CLA-001) não identifica se o produto pertence às categorias do anexo III (classes I/II) ou do anexo IV, que determinam a rota de avaliação da conformidade.
    en: The Manual's classification model (E/D/I axes → L1–L3, CLA-001) does not identify whether the product belongs to the categories of Annex III (classes I/II) or Annex IV, which determine the conformity assessment route.
  razao_fora_de_ambito: null
  conflito: false
  explicacao_conflito: null
  confianca: media
  aplicavel_desde: '2027-12-11'
  substitui: []
  nota:
    pt: CLA-001 classifica por risco aplicacional, não pela categoria regulamentar do produto; bastaria um atributo regulatório na classificação (Cap. 01).
    en: CLA-001 classifies by application risk, not by the regulatory category of the product; a regulatory attribute in the classification would suffice (Ch. 01).
