  nota:
    pt: 'A tensão entre o armazenamento WORM (Política 29 §8, obrigatório em L3) e o apagamento resolve-se na Política 29 §8.1: nos registos imutáveis os dados pessoais entram só como pseudónimo, o conteúdo identificador vai cifrado com chave por titular e o apagamento cumpre-se destruindo a chave (PRI-005). Se isso vale juridicamente como apagamento é matéria do DPO.'
    en: 'The tension between WORM storage (Policy 29 §8, mandatory at L3) and erasure is resolved in Policy 29 §8.1: in immutable logs, personal data enter only as a pseudonym, identifying content is encrypted with a per-person key, and erasure is achieved by destroying the key (PRI-005). Whether this counts legally as erasure is a matter for the DPO.'
