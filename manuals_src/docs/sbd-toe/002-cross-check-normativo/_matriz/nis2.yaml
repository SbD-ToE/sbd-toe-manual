    ancora: 3-princípios-fundamentais
    citacao:
      pt: sem registo formal, não existe exceção; existe incumprimento
      en: without a formal record, there is no exception; there is non-compliance
  - tipo: requisito
    alvo: CLA-003
    niveis: [L1, L2, L3]
    ficheiro: 010-sbd-manual/01-classificacao-aplicacoes/addon/00-catalogo-requisitos.md
    ancora: catálogo-cla---classificação-de-aplicações
    citacao:
      pt: O nível de classificação determina o conjunto de controlos base obrigatórios
      en: The classification level determines the set of mandatory baseline controls
  falta:
    pt: A não-aplicação de controlos passa por exceção formal documentada, mas as isenções por nível (requisitos marcados «-» ou «Recomendado» em L1/L2) não são exceções e não geram a fundamentação documentada, requisito a requisito, que o art. 2.º, n.º 2, exige quando se considere não aplicável um requisito modulado.
    en: Non-application of controls goes through a documented formal exception, but exemptions by level (requirements marked “-” or “Recommended” at L1/L2) are not exceptions and do not generate the documented justification, requirement by requirement, that Article 2(2) requires when a modulated requirement is considered not applicable.
