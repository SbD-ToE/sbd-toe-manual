- id: DORA-RTS1774-21-e-iv
  acto_fonte: 32024R1774
  referencia: art. 21.º, al. e), subal. iv)
  classe: engenharia
  forca: parcial
  contexto:
    id: CTX-DORA
    grau: null
  resposta:
  - tipo: requisito
    alvo: ACC-010
    niveis: [L2, L3]
    ficheiro: 010-sbd-manual/02-requisitos-seguranca/addon/02-lista-requisitos-base.md
    ancora: acc
    citacao:
      pt: Auditorias periódicas removem permissões obsoletas
      en: Periodic audits remove obsolete permissions
  - tipo: requisito
    alvo: GOV-014
    niveis: [L1, L2, L3]
    ficheiro: 010-sbd-manual/14-governanca-contratacao/addon/00-catalogo-requisitos.md
    ancora: catálogo-gov---governação-e-contratação
    citacao:
      pt: semestral em L1, trimestral em L2/L3
      en: half-yearly at L1, quarterly at L2/L3
  falta:
    pt: Recertificação de acessos pelo menos anual (todos os sistemas) e semestral (sistemas de FCI).
    en: Access recertification at least annually (all systems) and half-yearly (FCI systems).
  razao_fora_de_ambito: null
  conflito: true
  explicacao_conflito:
    pt: 'CONFLITO: ACC-010 não é obrigatório em L1 e não fixa frequência; o RTS exige ≥ anual e ≥ semestral para FCI. A GOV-014 (terceiros: semestral L1, trimestral L2/L3) cumpre só para acessos de contractors. Causa-raiz comum: a proporcionalidade do Manual é por nível L1–L3 (eixos E+D+I), não pela noção DORA de «função crítica ou importante»; um ativo que apoie uma FCI classificado L1/L2 fica abaixo do piso legal.'
    en: 'CONFLICT: ACC-010 is not mandatory at L1 and does not set a frequency; the RTS requires ≥ annual and ≥ half-yearly for FCI. GOV-014 (third parties: half-yearly L1, quarterly L2/L3) complies only for contractor access. Common root cause: the Manual''s proportionality is by level L1–L3 (E+D+I axes), not by the DORA notion of “critical or important function”; an asset supporting an FCI classified L1/L2 falls below the legal floor.'
  confianca: alta
  aplicavel_desde: '2025-01-17'
  substitui: [EXT-DORA-OBL-8-15]
  nota: null
