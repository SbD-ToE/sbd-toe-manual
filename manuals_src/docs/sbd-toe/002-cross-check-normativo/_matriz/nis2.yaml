    pt: O ponto 3.2.4 exige análise regular dos registos e limiares de alerta com alarmes automáticos, sem modulação por criticidade; o catálogo não os exige em L1 (LOG-004, LOG-007 e OPS-005 «-» em L1), embora a baseline «SEMPRE» do Cap. 00 peça «monitorizar anomalias» — inconsistência interna. Resolvido para entidades pertinentes pelos pisos CTX-NIS2-P03 a P05.
