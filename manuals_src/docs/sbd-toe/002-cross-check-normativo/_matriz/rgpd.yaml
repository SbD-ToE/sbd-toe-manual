    pt: Contrato do art. 28.º, n.º 3, só é prescrito para fornecedores de serviços de IA; para os demais subcontratantes a Política 33 §4 exige apenas cláusulas de segurança.
    en: The Article 28(3) contract is prescribed only for AI service vendors; for other processors Policy 33 §4 requires only security clauses.
