    en: 'Tension with Policy 12: the Manual''s blocking criterion is severity (Critical/High), not known exploitability, and the “fix deferred” and “risk accepted” exceptions may cover known exploitable vulnerabilities, which Annex I, Part I, point (2)(a) does not allow at placing on the market. Resolved for CRA products by floors CTX-CRA-P01 and CTX-CRA-P02.'
