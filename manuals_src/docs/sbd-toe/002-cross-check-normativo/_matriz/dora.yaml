- id: DORA-RTS1774-10-2-b
  acto_fonte: 32024R1774
  referencia: art. 10.º, n.º 2, al. b) e segundo parágrafo
  classe: engenharia
  forca: parcial
  contexto:
    id: CTX-DORA
    grau: FCI
  resposta:
  - tipo: politica
    rotulo:
      pt: Política 10 §9
      en: Policy 10 §9
    ficheiro: 020-assets/policies/10_policy-dependencias.md
    ancora: 9-auditoria-periódica
    citacao:
      pt: scan mensal em L1, quinzenal em L2 e semanal em L3
      en: scan monthly at L1, fortnightly at L2 and weekly at L3
  - tipo: us
    alvo: 05-dependencias-sbom-sca-us-09
    rotulo:
      pt: Cap. 05 US-09
      en: Ch. 05 US-09
    ficheiro: 010-sbd-manual/05-dependencias-sbom-sca/aplicacao-lifecycle.md
    ancora: us-09---auditoria-periódica-de-bibliotecas-copiadas-manualmente
    citacao:
      pt: 'Frequência de auditoria definida por Lx (L1: mensal, L2: quinzenal, L3: semanal)'
      en: 'Audit frequency defined per Lx (L1: monthly, L2: fortnightly, L3: weekly)'
  - tipo: politica
    rotulo:
      pt: Política 23 §4
      en: Policy 23 §4
    ficheiro: 020-assets/policies/23_policy-containers-seguros.md
    ancora: 4-scanning-de-imagens
    citacao:
      pt: O pipeline deve incluir scanning de vulnerabilidades da imagem produzida
      en: The pipeline must include vulnerability scanning of the image produced
  - tipo: politica
    rotulo:
      pt: Política 11 §7
      en: Policy 11 §7
    ficheiro: 020-assets/policies/11_policy-sbom.md
    ancora: 7-inventário-em-produção
    citacao:
      pt: Alertas configurados quando CVE publicado afeta componente presente no inventário de runtime
      en: Alerts configured when a published CVE affects a component present in the runtime inventory
  falta:
    pt: Análise automatizada de vulnerabilidades pelo menos semanal em todos os ativos que apoiam FCI (incl. infraestrutura, não só dependências/imagens).
    en: Automated vulnerability scanning at least weekly on all assets supporting FCI (incl. infrastructure, not only dependencies/images).
  razao_fora_de_ambito: null
  conflito: true
  explicacao_conflito:
    pt: 'CONFLITO: o Manual fixa scan de dependências mensal (L1) e quinzenal (L2), semanal só em L3, e o scan de imagens é por build; sem cláusula de precedência nesta cadência. Causa-raiz comum: a proporcionalidade do Manual é por nível L1–L3 (eixos E+D+I), não pela noção DORA de «função crítica ou importante»; um ativo que apoie uma FCI classificado L1/L2 fica abaixo do piso legal. A correlação contínua SBOM↔CVE em produção (Política 10 §8, Política 11 §7) mitiga para componentes de software.'
    en: 'CONFLICT: the Manual sets dependency scanning at monthly (L1) and fortnightly (L2), weekly only at L3, and image scanning is per build; there is no precedence clause for this cadence. Common root cause: the Manual''s proportionality is by level L1–L3 (E+D+I axes), not by the DORA notion of “critical or important function”; an asset supporting an FCI classified L1/L2 falls below the legal floor. Continuous SBOM↔CVE correlation in production (Policy 10 §8, Policy 11 §7) mitigates for software components.'
  confianca: alta
  aplicavel_desde: '2025-01-17'
  substitui: [EXT-DORA-OBL-8-15]
  nota: null
