    pt: A Diretiva exige capacidade de tratamento de incidentes para todos os sistemas da entidade; a Política 32 §2 torna-a apenas recomendada em aplicações L1 (só a notificação regulatória é obrigatória em qualquer nível). Uma aplicação L1 de entidade NIS2 fica sem processo de resposta obrigatório.
    en: The Directive requires incident handling capability for all of the entity's systems; Policy 32 §2 makes it only recommended in L1 applications (only regulatory notification is mandatory at any level). An L1 application of a NIS2 entity is left without a mandatory response process.
